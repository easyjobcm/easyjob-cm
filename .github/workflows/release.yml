name: Release

# Après une CI réussie sur un push vers main, tague le commit testé avec la
# version de son package.json (vX.Y.Z), sans écrire sur main. Le push du tag
# déclenche deploy.yml. Préparation de version, jetons et reprise :
# docs/deployment/production.md §9.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Une release à la fois ; les suivantes attendent au lieu de s'annuler.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # GH_PAT : un tag poussé avec GITHUB_TOKEN ne déclencherait pas deploy.yml.
      # Aucun code du dépôt n'est exécuté dans ce job.
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GH_PAT }}

      - name: Read release version
        id: version
        run: |
          version=$(jq -r '.version // empty' package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$version' de package.json invalide : X.Y.Z attendu, sans préversion."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Commit $SHA, version v$version"

      - name: Ensure commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)
          case "$status" in
            ahead|identical) ;;
            *)
              echo "::error::Le commit $SHA n'appartient pas à l'historique de main (statut : $status)."
              exit 1
              ;;
          esac

      # Idempotent : un tag déjà posé sur ce commit est réutilisé ; posé sur un
      # autre commit, il bloque la release. Jamais de force-push ni de suppression.
      - name: Create tag on tested commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Commit désigné par le tag distant (déréférencé s'il est annoté).
          # Échoue si le dépôt distant ne répond pas, plutôt que de conclure à
          # l'absence du tag.
          read_target() {
            # Le motif ^{} est requis : sans lui, ls-remote omet le commit d'un tag annoté.
            refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}") || {
              echo "::error::Lecture des tags distants impossible."
              exit 1
            }
            target=$(awk -v ref="refs/tags/$TAG" '$2 == ref "^{}" { peeled = $1 } $2 == ref { direct = $1 } END { print peeled ? peeled : direct }' <<< "$refs")
          }

          read_target
          if [ -z "$target" ]; then
            tags=$(git ls-remote --tags --refs origin 'refs/tags/v*')
            latest=$(awk '{ sub("^refs/tags/", "", $2); print $2 }' <<< "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
              echo "::error::$TAG n'est pas supérieure à la dernière release $latest."
              exit 1
            fi
            git tag "$TAG" "$SHA"
            if ! git push origin "refs/tags/$TAG"; then
              echo "Push refusé, relecture du tag distant."
            fi
            read_target
          fi

          if [ -z "$target" ]; then
            echo "::error::Tag $TAG absent après le push : vérifier GH_PAT (droits, expiration) et les règles de tags."
            exit 1
          fi
          if [ "$target" != "$SHA" ]; then
            echo "::error::Le tag $TAG désigne déjà $target et non $SHA. Aucune modification faite : incrémentez la version dans une nouvelle PR."
            exit 1
          fi
          echo "Tag $TAG -> $SHA"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG déjà présente."
            exit 0
          fi
          if ! gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes; then
            gh release view "$TAG" > /dev/null
            echo "Release $TAG créée par une exécution concurrente."
          fi
